name: Deploy docs to GitHub Pages

# Despliega docs-site/ a Pages en cada push a main que la toque.
# Requisito único manual: repo → Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      # base-href automático: el sitio vive en https://<user>.github.io/<repo>/
      - run: npx ng build --base-href=/${{ github.event.repository.name }}/
      # Truco SPA: GitHub Pages no reescribe rutas; 404.html = index.html
      # permite recargar o abrir directamente /demo, /uso, etc.
      - run: |
          cp dist/docs-site/browser/index.html dist/docs-site/browser/404.html
          touch dist/docs-site/browser/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist/docs-site/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
